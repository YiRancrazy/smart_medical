# 智慧医疗一键部署
# 前置：确保已安装 Docker 和 Docker Compose
# 启动：docker-compose up -d
# 停止：docker-compose down
# 日志：docker-compose logs -f backend

services:
  mysql:
    image: mysql:8.0
    container_name: smart-medical-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: ${TZ}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./src/main/resources/sql/CreateTable.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/sql/TestData.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      # 密码与上面的 MYSQL_ROOT_PASSWORD 同源，禁止再写死字面量
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smart-medical-net

  redis:
    image: redis:7-alpine
    container_name: smart-medical-redis
    # requirepass 与 .env 的 REDIS_PASSWORD 同源，否则客户端 AUTH 被拒
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-medical-net

  minio:
    image: quay.registry.cdn.w7.cc/minio/minio:${MINIO_IMAGE_TAG}
    container_name: smart-medical-minio
    command: server /data --console-address ":9001"
    environment:
      # MinIO 新版变量名；后端客户端与 MinIO 服务端共用同一对凭证，值取自同目录 .env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-medical-net

  backend:
    build: .
    container_name: smart-medical-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # .env 注入为容器环境变量（不经宿主机 shell 展开），
    # JWT 密钥 / MinIO bucket / 短信模板等值全部取自 .env。
    # 注意：仓库内 .env 为 dev 值且密钥已泄漏 git history，
    #       生产部署请用独立 prod 版 env 文件（勿直接沿用此 .env）。
    env_file:
      - .env
    environment:
      # 覆盖 .env 中面向宿主机/本地的 localdev，改为容器网络内的服务名。
      # environment 优先级高于 env_file，故此处生效。
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MINIO_HOST: minio
      # file-host 必须保持浏览器可达地址，故不覆盖 MINIO_PUBLIC_HOST
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    # 排障用：与 debug-tools 共享 /tmp，JVM Attach API 的 .java_pid<pid> socket 才能互通
    volumes:
      - jvm-tmp:/tmp
    networks:
      - smart-medical-net

  # 临时排障容器：默认不启动，仅在 --profile debug 时拉起，用完即删。
  # 复用 backend 的 PID / 网络命名空间，并共享 /tmp 以便 JVM Attach 与 Arthas。
  debug-tools:
    build:
      context: .
      dockerfile: Dockerfile.debug-tools
    image: smart-medical-debug-tools:17
    container_name: smart-medical-debug-tools
    pid: "service:backend"
    network_mode: "service:backend"
    volumes:
      - jvm-tmp:/tmp
    profiles:
      - debug
    tty: true
    stdin_open: true
    # 启动时把 Arthas 复制到共享 /tmp，使目标 JVM 也能按同一路径加载 agent
    command:
      - sh
      - -c
      - |
        rm -rf /tmp/arthas
        cp -a /opt/arthas /tmp/arthas
        while true; do sleep 3600; done
    # 最小权限原则：默认不放开，jstack -F / jmap -F / jhsdb / strace / gdb / tcpdump 按需取消注释
    # cap_add:
    #   - SYS_PTRACE
    #   - NET_ADMIN
    #   - NET_RAW
    # security_opt:
    #   - seccomp:unconfined

  admin:
    build:
      context: ./front/admin
      dockerfile: Dockerfile
    container_name: smart-medical-admin
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT}:80"
    networks:
      - smart-medical-net

  user:
    build:
      context: ./front/user
      dockerfile: Dockerfile
    container_name: smart-medical-user
    depends_on:
      - backend
    ports:
      - "${USER_PORT}:80"
    networks:
      - smart-medical-net

networks:
  smart-medical-net:
    driver: bridge

volumes:
  # Attach API 依赖共享的 ${java.io.tmpdir}，backend 与 debug-tools 均挂载到 /tmp
  jvm-tmp:
