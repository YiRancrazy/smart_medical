# 智慧医疗一键部署
# 前置：确保已安装 Docker 和 Docker Compose
# 启动：docker-compose up -d
# 停止：docker-compose down
# 日志：docker-compose logs -f backend
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: smart-medical-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dazhutizi
      MYSQL_DATABASE: smart_medical
      MYSQL_USER: yirancrazy
      MYSQL_PASSWORD: dazhutizi
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./src/main/resources/sql/CreateTable.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/sql/TestData.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smart-medical-net

  redis:
    image: redis:7-alpine
    container_name: smart-medical-redis
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-medical-net

  minio:
    image: minio/minio:latest
    container_name: smart-medical-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: dazhutizi
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-medical-net

  backend:
    build: .
    container_name: smart-medical-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # .env 注入为容器环境变量（不经宿主机 shell 展开），
    # JWT 密钥 / MinIO bucket / 短信模板等值全部取自 .env。
    # 注意：仓库内 .env 为 dev 值且密钥已泄漏 git history，
    #       生产部署请用独立 prod 版 env 文件（勿直接沿用此 .env）。
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - smart-medical-net

  admin:
    build:
      context: ./front/admin
      dockerfile: Dockerfile
    container_name: smart-medical-admin
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - smart-medical-net

  user:
    build:
      context: ./front/user
      dockerfile: Dockerfile
    container_name: smart-medical-user
    depends_on:
      - backend
    ports:
      - "5174:80"
    networks:
      - smart-medical-net

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  smart-medical-net:
    driver: bridge
