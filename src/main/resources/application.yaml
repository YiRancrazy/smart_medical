spring:
  application:
    name: smart-medical
  profiles:
    active: dev


# 配置JWT相关属性
jwt:
  accessSecretKey: d3b8f8a95c6e4712b88d3a7e1f4c92b1
  refreshSecretKey: d3b1f8a95c6e4712b88d3a7e1f4c92b1
  admin:
    adminAccessTokenPrefix: admin-access-token
    adminRefreshTokenPrefix: admin-refresh-token
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      # 需要修改的是这部分，改为自己的controller所在的位置
#      packages-to-scan: com.xiaominfo.knife4j.demo.web
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn


