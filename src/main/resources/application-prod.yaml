spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:dev-mysql-password-placeholder}
    url: jdbc:mysql://localdev:3306/smart_medical?useUnicode=true&characterEncoding=UTF-8
  reasonable: true
  support-methods-arguments: true
  page-size-zero: true
  params: count=countSql

# 配置JWT相关属性（密钥来自环境变量，禁止入库）
jwt:
  accessSecretKey: ${JWT_ACCESS_SECRET_KEY:dev-jwt-access-secret-placeholder}
  refreshSecretKey: ${JWT_REFRESH_SECRET_KEY:dev-jwt-refresh-secret-placeholder}
  admin:
    adminAccessTokenPrefix: admin-access-token
    adminRefreshTokenPrefix: admin-refresh-token

minio:
  endpoint: http://localdev:9000
  bucket-name: imagehost
  access-key: ${MINIO_ACCESS_KEY:dev-minio-access-placeholder}
  secret-key: ${MINIO_SECRET_KEY:dev-minio-secret-placeholder}
  img-size: 10                           # 图片大小限制，单位：m
  file-size: 10                          # 文件大小限制，单位：m
  file-host: http://localdev:9000